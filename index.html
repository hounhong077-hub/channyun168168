<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chann Yun International School</title> <!-- Updated Title -->
  
  <!-- APP ICON / FAVICON LINKS -->
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="apple-touch-icon" href="logo.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1a1f36" />
  <!-- ---------------------- -->

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <header>
      <!-- Optional: Show the logo on the page as well -->
      <img src="logo.png" alt="CYIS Logo" style="width: 100px; height: auto; margin-bottom: 16px; display: block;" />
      
      <h1>Chann Yun International School</h1>
      <p class="subtitle">Data is loaded live from Google Sheets.</p>
    </header>

    <section class="card">
      <div class="card-header">
        <h2>Sheet Data</h2>
        <button id="refreshBtn" class="btn-secondary">Refresh</button>
      </div>
      <div id="status" class="status"></div>
      <div id="tableWrap"></div>
    </section>

    <section class="card" id="formCard" hidden>
      <h2>Add a New Row</h2>
      <form id="addForm" class="form"></form>
      <p id="formMsg" class="form-msg"></p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
